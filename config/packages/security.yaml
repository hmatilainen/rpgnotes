security:
    password_hashers:
        App\Entity\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: username

    firewalls:
        mcp:
            pattern: ^/mcp
            stateless: true
            provider: app_user_provider
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: login
                check_path: login
                default_target_path: front_page
                enable_csrf: true
            logout:
                path: logout
                target: front_page
                enable_csrf: false

    access_control:
        - { path: ^/\.well-known/oauth-, roles: PUBLIC_ACCESS }
        - { path: ^/oauth/token$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/oauth/register$, roles: PUBLIC_ACCESS, methods: [POST] }
        - { path: ^/authorize, roles: ROLE_PLAYER }
        - { path: ^/mcp, roles: ROLE_PLAYER }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/reports, roles: ROLE_PLAYER }
        - { path: ^/ai-access, roles: ROLE_PLAYER }

    role_hierarchy:
        ROLE_ADMIN: ROLE_PLAYER
