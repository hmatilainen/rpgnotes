<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName rpg.kuura.art

    ServerAdmin hannu.matilainen@hannumatilainen.com

    ErrorLog ${APACHE_LOG_DIR}/rpg.kuura.art-error.log
    CustomLog ${APACHE_LOG_DIR}/rpg.kuura.art-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    SSLCertificateFile /etc/letsencrypt/live/rpg.kuura.art/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/rpg.kuura.art/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
