<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName notes.example.com

    ServerAdmin webmaster@notes.example.com

    ErrorLog ${APACHE_LOG_DIR}/notes.example.com-error.log
    CustomLog ${APACHE_LOG_DIR}/notes.example.com-access.log combined

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/

    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    SSLCertificateFile /etc/letsencrypt/live/notes.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/notes.example.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
